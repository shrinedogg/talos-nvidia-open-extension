# GSP firmware for the NVIDIA open GPU kernel modules.
#
# The firmware is NOT in the NVIDIA/open-gpu-kernel-modules GitHub repo; for
# versions ahead of NVIDIA's redist channel it is only distributed inside the
# official .run installer (a makeself self-extracting archive). We extract it
# with --extract-only (no installation is performed) and ship everything under
# firmware/ (gsp_*.bin plus ucodes_*.bin at 610.x+) to
# /usr/lib/firmware/nvidia/<version>/, where the open driver expects blobs
# exactly matching its own version.
name: nvidia-open-firmware
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      # {{ if eq .ARCH "aarch64" }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
      - url: https://download.nvidia.com/XFree86/Linux-aarch64/{{ .NVIDIA_DRIVER_VERSION }}/NVIDIA-Linux-aarch64-{{ .NVIDIA_DRIVER_VERSION }}.run
        destination: nvidia.run
        sha256: "{{ .NVIDIA_RUN_ARM64_SHA256 }}"
        sha512: "{{ .NVIDIA_RUN_ARM64_SHA512 }}"
      # {{ else }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
      - url: https://download.nvidia.com/XFree86/Linux-x86_64/{{ .NVIDIA_DRIVER_VERSION }}/NVIDIA-Linux-x86_64-{{ .NVIDIA_DRIVER_VERSION }}.run
        destination: nvidia.run
        sha256: "{{ .NVIDIA_RUN_AMD64_SHA256 }}"
        sha512: "{{ .NVIDIA_RUN_AMD64_SHA512 }}"
    # {{ end }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
    prepare:
      - |
        # unpack the makeself archive only; performs no installation
        sh nvidia.run --extract-only --target /nvidia-driver
    install:
      - |
        mkdir -p /rootfs/usr/lib/firmware/nvidia/{{ .NVIDIA_DRIVER_VERSION }}
        cp -R /nvidia-driver/firmware/* /rootfs/usr/lib/firmware/nvidia/{{ .NVIDIA_DRIVER_VERSION }}/
    test:
      - |
        # the open driver cannot initialize without GSP firmware
        ls /rootfs/usr/lib/firmware/nvidia/{{ .NVIDIA_DRIVER_VERSION }}/gsp_*.bin
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
