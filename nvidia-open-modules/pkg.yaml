name: nvidia-open-modules
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # kernel modules built against the pinned Talos kernel inside the
  # siderolabs/pkgs graph (make nvidia-open-latest-pkg)
  - image: "{{ .BUILD_ARG_NVIDIA_PKG_IMAGE }}"
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/lib/modules \
          /rootfs/usr/local/lib/modprobe.d

        cp /pkg/files/nvidia.conf /rootfs/usr/local/lib/modprobe.d/nvidia.conf

        cp -R /usr/lib/modules/* /rootfs/usr/lib/modules
    test:
      - |
        # The modules must be signed by the key whose certificate this repo
        # ships in certs/module-signing.crt, i.e. the key our published kernel
        # embeds. Anything else cannot load under module.sig_enforce=1.
        /pkg/files/verify-module-signatures.sh /rootfs/usr/lib/modules /pkg/files/module-signing.crt
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
