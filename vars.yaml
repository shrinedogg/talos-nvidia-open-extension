# Shared version pins for all packages in this repo.
#
# Sources (chosen to track the LATEST GA driver, ahead of NVIDIA's redist
# channel which lags GitHub releases by weeks/months):
#
#   - Kernel module sources: GitHub release tarball of
#     NVIDIA/open-gpu-kernel-modules (arch-independent; compiles the full
#     resource manager from src/ instead of linking NVIDIA's precompiled
#     nv-kernel.o_binary blobs shipped in redist archives).
#   - GSP firmware: extracted from the official .run installer at
#     download.nvidia.com/XFree86 (the firmware is NOT in the GitHub repo and
#     MUST exactly match the module version).
#
# NVIDIA publishes no checksums for either source; values below are computed
# and pinned by hack/update-checksums.sh. Vulkan-beta prereleases (e.g.
# 595.44.x) are marked prerelease on GitHub and must not be pinned.
#
# CAVEAT: userspace driver libs (nvidia-container-toolkit pairing) must match
# this version exactly; see PLAN.md Phase 6.

# renovate: datasource=github-releases depName=NVIDIA/open-gpu-kernel-modules
NVIDIA_DRIVER_VERSION: 610.57.04

