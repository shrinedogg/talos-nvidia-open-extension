# Final extension: userspace + toolkit + persistenced wrapper + the two Talos
# service definitions. Mirrors siderolabs/extensions
# nvidia-gpu/nvidia-container-toolkit/production.
name: nvidia-open-toolkit
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: nvidia-open-pkgs
  - stage: nvidia-container-runtime
  - stage: nvidia-persistenced-wrapper
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/local/etc/containers
        mkdir -p /rootfs/usr/local/lib/containers/nvidia-cdi-gen
        cp /pkg/nvidia-persistenced.yaml /rootfs/usr/local/etc/containers/nvidia-persistenced.yaml
        cp /pkg/nvidia-cdi-gen.yaml /rootfs/usr/local/etc/containers/nvidia-cdi-gen.yaml
    test:
      - |
        test -e /rootfs/usr/local/lib/libcuda.so.{{ .NVIDIA_DRIVER_VERSION }}
        test -x /rootfs/usr/local/bin/nvidia-container-runtime
        test -x /rootfs/usr/local/bin/nvidia-persistenced-wrapper
        test -e /rootfs/etc/cri/conf.d/10-nvidia-container-runtime.part
        test ! -e /rootfs/usr/lib/firmware
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
