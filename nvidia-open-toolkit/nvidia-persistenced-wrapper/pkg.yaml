# Wrapper that starts nvidia-persistenced and cleans a stale pid file first.
# Vendored from siderolabs/extensions v1.13.8 (MPL-2.0).
name: nvidia-persistenced-wrapper
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - env:
      GOPATH: /tmp/go
  - cachePaths:
      - /.cache/go-build
      - /tmp/go/pkg
  - network: default
    prepare:
      - |
        cp -r /pkg/* .
      - |
        go mod download
  - network: none
    build:
      - |
        CGO_ENABLED=0 go build -o nvidia-persistenced-wrapper main.go
    install:
      - |
        mkdir -p /rootfs/usr/local/bin

        cp nvidia-persistenced-wrapper /rootfs/usr/local/bin/nvidia-persistenced-wrapper
    test:
      - |
        test -x /rootfs/usr/local/bin/nvidia-persistenced-wrapper
finalize:
  - from: /rootfs
    to: /rootfs
