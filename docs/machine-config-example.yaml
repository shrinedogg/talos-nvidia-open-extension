# Talos machine configuration patch for the nvidia-open-modules +
# nvidia-open-firmware system extensions.
#
# PREREQUISITE — extensions are NOT enabled via machine config. Both
#   docker.io/<username>/nvidia-open-modules:<driver>-<talos>
#   docker.io/<username>/nvidia-open-firmware:<driver>-<talos>
# must be baked into the installer/boot image TOGETHER and at MATCHING
# versions (the GSP firmware must exactly match the kernel-module driver
# version, or the modules fail to initialize). Do this either via a custom
# Image Factory schematic (customization.systemExtensions.officialExtensions
# only lists Sidero's catalog — for these images use an imageCache/schematic
# supporting arbitrary extension refs, or build a custom installer) or by
# building an installer with `imager` and applying it with:
#   talosctl upgrade --image <your-custom-installer>:<talos-version>
#
# Apply this patch with:
#   talosctl patch machineconfig --patch @machine-config-example.yaml
# or include it at cluster generation time with `talosctl gen config --config-patch`.

machine:
  kernel:
    # The extension ships a modprobe.d blacklist for these modules so they are
    # never auto-loaded at an inconvenient point in boot; they MUST therefore
    # be loaded explicitly here.
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  sysctls:
    # Required when using the NVIDIA container toolkit (nvidia-container-cli
    # needs the BPF JIT unhardened); harmless otherwise. From the Talos NVIDIA
    # GPU documentation.
    net.core.bpf_jit_harden: "0"
